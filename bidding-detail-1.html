    <style>
        .detail-hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('images/hero-bg.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 0;
            text-align: center;
        }
        .detail-hero h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .detail-hero p {
            font-size: 1.05rem;
            opacity: 0.85;
        }
        .detail-body {
            padding: 60px 0;
        }
        .detail-section {
            margin-bottom: 50px;
        }
        .detail-section h2 {
            font-size: 1.6rem;
            color: var(--black);
            border-left: 4px solid var(--primary-red);
            padding-left: 15px;
            margin-bottom: 25px;
        }
        .notice-image {
            width: 100%;
            max-width: 900px;
            display: block;
            margin: 0 auto 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            border: 1px solid #eee;
        }
        .report-link-card {
            background: var(--gray-light);
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            border: 2px dashed var(--gray-medium);
            transition: all 0.3s ease;
        }
        .report-link-card:hover {
            border-color: var(--primary-red);
            background: #fff5f5;
        }
        .report-link-card i {
            font-size: 3rem;
            color: var(--primary-red);
            margin-bottom: 15px;
        }
        .report-link-card h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--black);
        }
        .report-link-card p {
            color: var(--gray-medium);
            margin-bottom: 20px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            color: var(--gray-medium);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: var(--primary-red);
        }
        .project-info-box {
            background: var(--gray-light);
            border-radius: 12px;
            padding: 25px 30px;
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .project-info-box .info-item label {
            display: block;
            font-size: 0.8rem;
            color: var(--gray-medium);
            margin-bottom: 4px;
        }
        .project-info-box .info-item span {
            font-size: 1rem;
            color: var(--black);
            font-weight: 500;
        }
